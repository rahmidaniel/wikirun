<p-floatlabel>
  <p-auto-complete
    [ngModel]="currentArticle"
    [suggestions]="suggestions()"
    (onSelect)="onSelect($event.value)"
    (ngModelChange)="onSearch($event)"
    forceSelection="false"
    optionLabel="title"
    required
    fluid
    size="large"
    [inputId]="label()" />
  <label [for]="label()">{{ label() }}</label>
</p-floatlabel>
