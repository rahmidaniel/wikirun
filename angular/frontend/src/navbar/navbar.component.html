<div class="flex-1">
  <a class="btn btn-ghost rounded-3xl normal-case text-xl" (click)="onHomeClick($event)">Wikipedia Speedrun</a>
</div>

@if (gameStateService.state() === GameState.IN_GAME) {
  <button class="btn rounded-btn btn-error" (click)="gameStateService.cheat()">Cheat</button>
}

<label class="swap swap-rotate">
  <input type="checkbox" class="theme-controller" value="dark" />

  <i class="fas fa-sun swap-off text-3xl"></i>
  <i class="fas fa-moon swap-on text-3xl"></i>
</label>
